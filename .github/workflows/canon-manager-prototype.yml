name: Canon manager prototype

on:
  push:
    branches:
      - docs/historias-organizadas
    paths:
      - "proyecto/app/**"
      - ".github/workflows/canon-manager-prototype.yml"
  pull_request:
    paths:
      - "proyecto/app/**"
      - ".github/workflows/canon-manager-prototype.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proyecto/app/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("src/canon_manager/static/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No se encontró un bloque JavaScript en la interfaz.")
          Path("/tmp/canon-manager-ui.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/canon-manager-ui.js
