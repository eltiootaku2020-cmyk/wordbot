name: Canon manager prototype

on:
  push:
    branches:
      - docs/historias-organizadas
    paths:
      - "proyecto/app/**"
      - ".github/workflows/canon-manager-prototype.yml"
  pull_request:
    paths:
      - "proyecto/app/**"
      - ".github/workflows/canon-manager-prototype.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: proyecto/app/requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
